name: Desktop Windows
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml', 'transports/**', 'core/**', 'framework/**', 'plugins/**', 'ui/**', 'tests/e2e/**']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml', 'ui/**', 'tests/e2e/**']
permissions:
  contents: read
concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: transports/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Rust MSVC stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: true
      - name: Configure CGO
        run: |
          $compiler = '${{ steps.msys2.outputs.msys2-location }}/mingw64/bin'
          $compiler >> $env:GITHUB_PATH
          "CC=$compiler/gcc.exe" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true
      - name: Build UI, gateway, Tauri and portable ZIP
        run: ./desktop/scripts/build.ps1 release
      - name: Install desktop UI E2E test dependencies
        run: npm ci --prefix tests/e2e --no-audit --no-fund
      - name: Verify ordinary and desktop UI presentations
        run: node desktop/scripts/oss-ui-smoke.mjs
      - name: Desktop unit and real gateway smoke tests
        run: ./desktop/scripts/build.ps1 test
      - name: Launch extracted portable desktop and verify ownership
        run: ./desktop/scripts/host-smoke.ps1
      - name: Exercise isolated Desktop Settings WebView
        run: |
          cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml
          Copy-Item desktop/src-tauri/binaries/bifrost-http.exe desktop/src-tauri/target/debug/bifrost-http.exe -Force
          npm install --prefix desktop/.tools/qa --no-save --package-lock=false playwright@1.63.0
          node desktop/scripts/settings-smoke.cjs
      - name: Verify ordinary gateway still builds
        run: go build -o desktop/dist/bifrost-server-check.exe ./transports/bifrost-http
        env:
          CGO_ENABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: bif-app-windows-x64-portable
          path: |
            desktop/dist/bif-app-windows-x64-portable.zip
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-settings-test-evidence
          path: desktop/test-results/settings-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-presentation-e2e-evidence
          path: |
            desktop/test-results/oss-ui-*/
            desktop/test-results/oss-ui-gateway.log
            desktop/playwright-report/
          if-no-files-found: ignore
