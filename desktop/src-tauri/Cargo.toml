[package]
name = "bif-app"
version = "0.1.0-alpha.4"
edition = "2021"
license = "Apache-2.0"
description = "Independent local desktop wrapper for Bifrost AI Gateway"
authors = ["Khun <khun.mail@qq.com>"]

[build-dependencies]
tauri-build = "=2.7.0"

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.0"
tauri-plugin-autostart = "=2.6.0"
tauri-plugin-opener = "=2.6.0"
tauri-plugin-clipboard-manager = "=2.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
getrandom = "=0.4.3"
zeroize = "=1.9.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
